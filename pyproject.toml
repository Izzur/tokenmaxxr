[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenmaxxr"
version = "1.1.0"
description = "Aggregate AI subscription quota usage (Claude, Kiro, ClinePass, Ollama Cloud, OpenCode Go) into one view."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Izzur", email = "13365626+Izzur@users.noreply.github.com" }]
keywords = ["ai", "quota", "usage", "claude", "kiro", "opencode", "cline", "ollama", "waybar", "dankmaterialshell", "fastfetch"]
maintainers = [{ name = "Izzur", email = "13365626+Izzur@users.noreply.github.com" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "browser-cookie3>=0.20",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
tokenmaxxr = "tokenmaxxr.cli:main"

[project.urls]
Homepage = "https://github.com/Izzur/tokenmaxxr"
"Bug Tracker" = "https://github.com/Izzur/tokenmaxxr/issues"

[tool.hatch.build.targets.wheel]
packages = ["tokenmaxxr"]
include = ["tokenmaxxr/py.typed", "tokenmaxxr/_webui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
